name: Feature / Improvement Request
description: Suggest a new idea, component, or enhancement for the OSCC website
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make the OSCC website better? Let's discuss it! 💡
  - type: textarea
    id: problem
    attributes:
      label: Problem or Opportunity
      description: Is your feature request related to a problem or a new opportunity?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any screenshots, mockups, or reference links.
    validations:
      required: false
